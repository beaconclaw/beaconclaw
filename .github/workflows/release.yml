name: Release

# Tags decide the release track:
#   v0.1.0          stable: an official release, marked "latest"
#   v0.1.0-beta.1   beta: a pre-release, never marked "latest"
# The installer and `beaconclaw update` only pick a pre-release when asked to.

on:
  push:
    tags:
      - "v*"

# Nothing is granted by default. Only the final publishing job may write.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
      make_latest: ${{ steps.tag.outputs.make_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Classify the tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tag '$tag' is neither a stable version (v0.1.0) nor a pre-release (v0.1.0-beta.1)."
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A release is built from a clean toolchain, not a shared cache.
          cache: false

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        run: make cross-compile VERSION="${GITHUB_REF_NAME}"

      - name: Write checksums
        run: make checksums && cat bin/checksums.txt

      - name: Hand the files to the publishing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            bin/beaconclaw-*
            bin/checksums.txt
          if-no-files-found: error
          retention-days: 1

  # Publishing is the only step that can write to the repository. It runs no
  # project code: it downloads what the build job produced and uploads it.
  publish:
    needs: build
    runs-on: ubuntu-latest
    # An official release waits here for the maintainer's approval: the
    # "release" environment has a required reviewer. A pre-release publishes
    # without waiting. Both environments accept version tags only.
    environment: ${{ needs.build.outputs.prerelease == 'true' && 'release-beta' || 'release' }}
    permissions:
      contents: write
    steps:
      - name: Fetch the built files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: bin

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease }}
          make_latest: ${{ needs.build.outputs.make_latest }}
          files: |
            bin/beaconclaw-linux-amd64
            bin/beaconclaw-linux-arm64
            bin/beaconclaw-darwin-amd64
            bin/beaconclaw-darwin-arm64
            bin/beaconclaw-windows-amd64.exe
            bin/beaconclaw-windows-arm64.exe
            bin/checksums.txt

      # A default install follows "latest". Prove a pre-release never becomes it.
      - name: Check that "latest" is a stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name + " " + (.prerelease|tostring)')
          echo "latest: $latest"
          tag="${latest% *}"
          if [[ "$tag" == *-* || "${latest#* }" != "false" ]]; then
            echo "::error::The latest release is '$tag', which is a pre-release."
            exit 1
          fi
          if [[ "${{ needs.build.outputs.prerelease }}" == "true" && "$tag" == "${GITHUB_REF_NAME}" ]]; then
            echo "::error::Pre-release ${GITHUB_REF_NAME} was marked latest."
            exit 1
          fi
