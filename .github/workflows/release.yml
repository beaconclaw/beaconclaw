name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        run: make cross-compile

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bin/beaconclaw-linux-amd64
            bin/beaconclaw-linux-arm64
            bin/beaconclaw-darwin-amd64
            bin/beaconclaw-darwin-arm64
            bin/beaconclaw-windows-amd64.exe
            bin/beaconclaw-windows-arm64.exe
