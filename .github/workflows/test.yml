name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal/config internal/daemon internal/profile internal/update)"

      - name: Vet
        run: go vet ./... && GOOS=windows go vet ./... && GOOS=darwin go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Cross-compile and write checksums
        run: make cross-compile checksums
